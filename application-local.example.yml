spring:
  ai:
    deepseek:
      api-key: ""
    openai:
      api-key: ""
  datasource:
    url: ""
    username: ""
    password: ""

tavily:
  api-key: ""

agenttrail:
  pgvector:
    url: ""
    username: ""
    password: ""
  minio:
    endpoint: ""
    access-key: ""
    secret-key: ""
  skills:
    directory: ""
  redis:
    # 可选：跨实例任务锁/中断广播，默认关闭。部署到有真实 Redis 的环境时打开。
    enabled: false
    address: "redis://127.0.0.1:6379"
  analytics:
    datasource:
      enabled: false
      # 与主库相同 database，但必须使用只能读取业务表的 analytics_ro 账号。
      jdbc-url: "jdbc:mysql://127.0.0.1:3306/agenttrail?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"
      username: "analytics_ro"
      password: ""
      maximum-pool-size: 10
      connection-timeout-ms: 5000
