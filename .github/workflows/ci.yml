name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过测试（仅用于快速验证部署/基础设施改动，业务代码改动走正常 push 触发的全量测试）"
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

# 带 MySQL、Postgres、MinIO、MCP 和外部模型的集成测试只在本地基础设施环境运行，
# GitHub Actions 仅执行不依赖这些本地服务的默认测试集。
jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/main/resources/ppt-scripts/requirements.txt

      - name: Install PPT renderer dependencies
        run: python -m pip install --requirement src/main/resources/ppt-scripts/requirements.txt

      - name: Build and test
        run: ./mvnw -B -ntp ${{ inputs.skip_tests && 'package -DskipTests' || 'verify' }}

      - name: Publish test report
        if: ${{ always() && !inputs.skip_tests }}
        uses: dorny/test-reporter@v1
        with:
          name: JUnit tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && !inputs.skip_tests }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-trail-jar
          path: target/agent-trail-*.jar
          if-no-files-found: error
          retention-days: 7

      # Builds the deployable image on every push so a broken Dockerfile fails CI immediately.
      # Pushing to a registry is a separate, opt-in step gated on secrets existing — those get
      # set up in Phase B (real registry + credentials), not something CI can default to.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agenttrail:ci

      - name: Log in to registry
        if: ${{ env.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 推镜像和部署都只在手动触发时跑（见 workflow_dispatch），push 到 dev 只做构建校验——
      # 部署面向的是给面试官看的演示服务器，不希望日常 push 就自动重新部署上去。
      - name: Push Docker image
        if: ${{ env.REGISTRY_USERNAME != '' && github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # REGISTRY_URL 只是仓库域名（登录用），完整镜像路径还要接上命名空间/仓库名——
          # ACR 个人版这两段都叫 agenttrail，容易漏写一段导致推到不存在的路径。
          tags: ${{ secrets.REGISTRY_URL }}/agenttrail/agenttrail:${{ github.sha }},${{ secrets.REGISTRY_URL }}/agenttrail/agenttrail:latest

      # 服务器在国内，直连 Docker Hub 拉 mysql/postgres/redis/minio 这几个官方镜像会超时
      # （ACR 的镜像加速器只覆盖"特定范围"的镜像，这几个不在范围内）。GitHub Actions 的
      # runner 在国外，拉 Docker Hub 没有障碍，这里顺手转推一份到 ACR 底下，服务器只需要
      # 连 ACR 就能拿到，不用再碰 Docker Hub。这几个基础镜像版本不常变，重复推是幂等的。
      - name: Mirror base images to ACR
        if: ${{ env.REGISTRY_USERNAME != '' && github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          for pair in "mysql:8.4" "pgvector/pgvector:pg16" "redis:7-alpine" "minio/minio:latest" "node:20-alpine"; do
            src="$pair"
            name="$(basename "${pair%%:*}")"
            tag="${pair##*:}"
            dest="${{ secrets.REGISTRY_URL }}/agenttrail/$name:$tag"
            docker pull "$src"
            docker tag "$src" "$dest"
            docker push "$dest"
          done

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Deploy via SSH
        if: ${{ env.SERVER_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/agenttrail
            docker login --username "${{ secrets.REGISTRY_USERNAME }}" --password "${{ secrets.REGISTRY_PASSWORD }}" "${{ secrets.REGISTRY_URL }}"
            sed -i "s#^IMAGE_TAG=.*#IMAGE_TAG=${{ github.sha }}#" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
