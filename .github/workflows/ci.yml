name: CI

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run the live integration suite (requires repository secrets)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-trail-jar
          path: target/agent-trail-*.jar
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Live integration suite (JDK 21)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agenttrail
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=30
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pgvector
          POSTGRES_PASSWORD: pgvector
          POSTGRES_DB: vector_store
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U pgvector -d vector_store"
          --health-interval=10s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start MinIO and create chart bucket
        shell: bash
        run: |
          docker run -d --name agenttrail-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address :9001
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { docker logs agenttrail-minio; exit 1; }
          docker run --rm --network host minio/mc:latest alias set local http://127.0.0.1:9000 minioadmin minioadmin
          docker run --rm --network host minio/mc:latest mb --ignore-existing local/agenttrail-charts
          docker run --rm --network host minio/mc:latest anonymous set download local/agenttrail-charts

      - name: Start mcp-echarts
        shell: bash
        env:
          MINIO_ENDPOINT: localhost
          MINIO_PORT: '9000'
          MINIO_USE_SSL: 'false'
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET_NAME: agenttrail-charts
        run: |
          nohup npx --yes mcp-echarts -t streamable -p 3033 >"$RUNNER_TEMP/mcp-echarts.log" 2>&1 &
          ready=0
          for attempt in {1..60}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3033/mcp || true)
            if [ "$status" != 000 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { cat "$RUNNER_TEMP/mcp-echarts.log"; exit 1; }

      - name: Check integration credentials
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY repository secret"; exit 1; }
          test -n "$DASHSCOPE_API_KEY" || { echo "Missing DASHSCOPE_API_KEY repository secret"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "Missing TAVILY_API_KEY repository secret"; exit 1; }

      - name: Run integration tests
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENTTRAIL_DB_URL: jdbc:mysql://127.0.0.1:3306/agenttrail?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
          AGENTTRAIL_DB_USERNAME: root
          AGENTTRAIL_DB_PASSWORD: root
          AGENTTRAIL_PGVECTOR_URL: jdbc:postgresql://127.0.0.1:5433/vector_store
          AGENTTRAIL_PGVECTOR_USERNAME: pgvector
          AGENTTRAIL_PGVECTOR_PASSWORD: pgvector
          AGENTTRAIL_PGVECTOR_MAXIMUM_POOL_SIZE: '2'
          AGENTTRAIL_MINIO_ENDPOINT: http://127.0.0.1:9000/
          AGENTTRAIL_MINIO_ACCESS_KEY: minioadmin
          AGENTTRAIL_MINIO_SECRET_KEY: minioadmin
          AGENTTRAIL_MINIO_BUCKET: agenttrail-charts
          MCP_ECHARTS_URL: http://127.0.0.1:3033/mcp
        run: ./mvnw -B -ntp -Pintegration verify

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit integration tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
