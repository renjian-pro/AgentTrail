name: CI

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

# 带 MySQL、Postgres、MinIO、MCP 和外部模型的集成测试只在本地基础设施环境运行，
# GitHub Actions 仅执行不依赖这些本地服务的默认测试集。
jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/main/resources/ppt-scripts/requirements.txt

      - name: Install PPT renderer dependencies
        run: python -m pip install --requirement src/main/resources/ppt-scripts/requirements.txt

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-trail-jar
          path: target/agent-trail-*.jar
          if-no-files-found: error
          retention-days: 7
