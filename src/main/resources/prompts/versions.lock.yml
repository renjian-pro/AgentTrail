# 提示词版本锁（issue #100）。
#
# 改了正文就把对应文件 front matter 里的 version 往上加一档，并同步这里的 hash。
# 不改版本号只改正文时，PromptRegistry 会在启动时 WARN，PromptRegistryLockTest 会失败——
# 因为那会让 Golden 分数变化归因到错误的版本，是评测体系里最难查的一类错。
prompts:
  # 模式级系统提示词（issue #111 / R22）：角色定位、能力边界、工具用法说明。
  # 只写边界，不写 SOP——"这类任务按什么套路做"仍在 skills/ 里走 Skill 元工具按需加载（R2）。
  analytics.system: v1#bdac6cea
  chat.system: v1#dde9c8bc
  deepresearch.clarification: v1#f05a7bfc
  deepresearch.critique: v1#f38b5e93
  deepresearch.execute: v1#1f309300
  deepresearch.plan: v1#812901f2
  deepresearch.summarize: v1#990f07e9
  deepresearch.topic_generation: v1#a0edeb9e
  ppt.clarification: v4#2102d156
  ppt.image: v1#ca695357
  ppt.outline: v2#d9f40cef
  ppt.requirement: v3#e39a4d86
  ppt.schema: v4#9514b2b5
  ppt.search: v2#8d54d602
  runtime.context_compaction: v1#d35f7ee8
  runtime.llm_judge: v1#59c537a8
  runtime.memory_extraction: v1#733cf30a
