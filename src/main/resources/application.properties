spring.application.name=AgentTrail

spring.config.import=optional:file:./secrets.properties

# V0（com.agenttrail.legacy.V0.AgentScopeRuntime，见 AgentRuntimeConfig）用的手写配置键
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

# V1（loop.core.AgentLoopExecutor，见 AgentLoopExecutorConfig）用的 Spring AI 标准配置键——
# 同一套环境变量，spring-ai-starter-model-deepseek 据此自动装配 ChatModel Bean
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.chat.options.model=${DEEPSEEK_MODEL:deepseek-chat}

# Qwen（issue #20，多模型路由的默认模型 qwen-plus）走 OpenAI 兼容模式接入 DashScope——
# spring-ai-starter-model-openai 据此自动装配 openAiChatModel Bean。key 本身不写在这里，
# 由 secrets.properties（gitignore，不进仓库）注入 DASHSCOPE_API_KEY
spring.ai.openai.api-key=${DASHSCOPE_API_KEY:}
spring.ai.openai.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
spring.ai.openai.chat.options.model=${DASHSCOPE_MODEL:qwen-plus}

# 会话/文件等持久化用的生产数据源——和集成测试连的是同一个库（见 SharedMySql），root/root
# 是这台机器上专为本项目建的库的本地开发凭据，非敏感信息，跟 SharedMySql.java 里保持一致
spring.datasource.url=${AGENTTRAIL_DB_URL:jdbc:mysql://127.0.0.1:3306/agenttrail?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${AGENTTRAIL_DB_USERNAME:root}
spring.datasource.password=${AGENTTRAIL_DB_PASSWORD:root}
# schema.sql 里全部是 CREATE TABLE IF NOT EXISTS，每次启动重跑是幂等的
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# 大文件 RAG 检索（issue #26）用的 embedding 模型——同一个 DashScope 账号，同一套 base-url/api-key，
# 只是模型名不同；spring-ai-starter-model-openai 据此自动装配 openAiEmbeddingModel Bean
spring.ai.openai.embedding.options.model=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}

# PgVector 是独立于 agent_session 那个 MySQL 的另一个库（见 RagConfig），复用这台机器上已经在跑的
# pgvector/pgvector:pg16 容器；vector_store 库和 pgvector/pgvector 凭据是参考实现（dodo-agent）
# 已经建好、非敏感的本地开发默认值
agenttrail.pgvector.url=${AGENTTRAIL_PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5433/vector_store}
agenttrail.pgvector.username=${AGENTTRAIL_PGVECTOR_USERNAME:pgvector}
agenttrail.pgvector.password=${AGENTTRAIL_PGVECTOR_PASSWORD:pgvector}

# spring-ai-starter-vector-store-pgvector 自带的自动装配会拿 Boot 自动配置的 JdbcTemplate
# （指向上面那个 MySQL！）去建一个默认名叫 vector_store 的 PgVectorStore Bean——业务库和向量库
# 完全是两个不同的数据库实例，这个自动装配的默认假设（同一个 DataSource 兼作两者）在这个项目里
# 不成立。RagConfig 手工建的 fileChunkVectorStore 才是真正连到 Postgres 容器的那个，必须排除
# 这个自动装配，否则容器里会同时存在一个连错库的 VectorStore Bean
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# 图片文件多模态问答（issue #27）——同一个 DashScope 账号，用 Prompt 级别的模型名覆盖走
# qwen3-vl-plus，不单独建 ChatModel bean（见 ImageDescriptionService）
agenttrail.multimodal.model=${DASHSCOPE_MULTIMODAL_MODEL:qwen3-vl-plus}

# 联网搜索（issue #22）：Tavily MCP streamable-HTTP，懒加载建连（见 TavilySearchToolProvider），
# key 缺失时优雅降级——不是构造这个 Bean 就要求 key 一定存在。超时从 10s 提到 30s（issue #25
# DeepResearch 联调时发现：真实检索请求偶尔就是要 10s+ 才有响应，尤其是网络本身有负载的时候，
# 10s 卡得太紧，正常请求也会被误杀成超时）
tavily.api-key=${TAVILY_API_KEY:}
tavily.mcp-url=${TAVILY_MCP_URL:https://mcp.tavily.com/mcp/}
tavily.timeout-seconds=${TAVILY_TIMEOUT_SECONDS:30}
tavily.max-attempts=${TAVILY_MAX_ATTEMPTS:2}

# 图表生成（issue #23）：mcp-echarts MCP streamable-HTTP，懒加载建连（见 ChartToolProvider），
# 服务本身不可用时优雅降级——不是构造这个 Bean 就要求它一定在跑。mcp-echarts 是独立部署的
# Node 进程（本机开发：npx mcp-echarts -t streamable -p 3033），不是这个 Java 进程的子进程
agenttrail.mcp-echarts.url=${MCP_ECHARTS_URL:http://localhost:3033/mcp}
agenttrail.mcp-echarts.timeout-seconds=${MCP_ECHARTS_TIMEOUT_SECONDS:15}
agenttrail.mcp-echarts.max-attempts=${MCP_ECHARTS_MAX_ATTEMPTS:2}

# mcp-echarts 自己内置的 MinIO 集成用的对象存储（渲染完图表直传，工具返回值是 URL 不是 base64）——
# 这几项是那个独立 Node 进程自己的环境变量（MINIO_ENDPOINT/MINIO_BUCKET_NAME 等），不经过 Spring，
# 这里写出来纯粹是给部署/运维对齐配置用；minioadmin/minioadmin 是这台机器上 llmentor-minio 容器
# 的本地开发默认凭据，非敏感信息。agenttrail-charts 是本项目自己的 bucket——和 agenttrail 数据库、
# pgvector 的 agent_file_chunk 表同一个"共享实例、各项目各自一份资源"的约定
agenttrail.minio.endpoint=${AGENTTRAIL_MINIO_ENDPOINT:http://localhost:9000/}
agenttrail.minio.access-key=${AGENTTRAIL_MINIO_ACCESS_KEY:minioadmin}
agenttrail.minio.secret-key=${AGENTTRAIL_MINIO_SECRET_KEY:minioadmin}
agenttrail.minio.bucket=${AGENTTRAIL_MINIO_BUCKET:agenttrail-charts}

# PPT 生成状态机（issue #24）：Python 渲染脚本路径、模板文件路径、渲染超时全部走配置，
# 不写死本地绝对路径——默认值是相对于仓库根目录的相对路径，和这个项目当前"mvn 系列命令
# 都从仓库根目录跑"的实际使用方式一致（见 PptGenerationConfig）
agenttrail.ppt.python-executable=${AGENTTRAIL_PPT_PYTHON:python}
agenttrail.ppt.render-script-path=${AGENTTRAIL_PPT_RENDER_SCRIPT:src/main/resources/ppt-scripts/render_ppt.py}
agenttrail.ppt.template-path=${AGENTTRAIL_PPT_TEMPLATE:src/main/resources/ppt-templates/default-template.pptx}
agenttrail.ppt.output-dir=${AGENTTRAIL_PPT_OUTPUT_DIR:target/ppt-output}
agenttrail.ppt.render-timeout-seconds=${AGENTTRAIL_PPT_RENDER_TIMEOUT_SECONDS:60}
# REQUIREMENT/OUTLINE/SCHEMA 三个状态用的模型——不需要工具，和 DeepResearchConfig 里
# 需求澄清/主题生成/总结几步同样的理由，默认 deepseek-chat
agenttrail.ppt.model=${AGENTTRAIL_PPT_MODEL:deepseek-chat}

# IMAGE 状态（issue #31）：调文生图 API 拿到的图片立即下载转存 MinIO，不直接持久化第三方临时链接。
# 文生图走 DashScope qwen-image-plus 的原生 REST 接口（不是 spring.ai.openai.* 那套 OpenAI 兼容
# 模式——那一层没有图像生成这个 output modality），接口契约见 DashScopeImageClient 类注释；
# 复用同一个 DASHSCOPE_API_KEY（issue #20/#27 已经在用的同一个 DashScope 账号，不是新申请的 key）
agenttrail.ppt.image.endpoint=${AGENTTRAIL_PPT_IMAGE_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
agenttrail.ppt.image.api-key=${DASHSCOPE_API_KEY:}
agenttrail.ppt.image.model=${AGENTTRAIL_PPT_IMAGE_MODEL:qwen-image-plus}
agenttrail.ppt.image.size=${AGENTTRAIL_PPT_IMAGE_SIZE:1024*1024}
agenttrail.ppt.image.timeout-seconds=${AGENTTRAIL_PPT_IMAGE_TIMEOUT_SECONDS:60}
# 转存用的 MinIO——同一个 llmentor-minio 容器、同一套 minioadmin/minioadmin 本地开发凭据，
# 复用 issue #23 图表功能已经在用的那几个 AGENTTRAIL_MINIO_* 环境变量，bucket 单独一个
# agenttrail-ppt-images（和 agenttrail-charts 同一个"共享实例、各功能各自一份 bucket"约定），
# 不像 issue #23 那样要求运维提前手工建好——MinioPptImageStore 首次使用时自己惰性创建 + 设公开只读
agenttrail.ppt.image.minio-endpoint=${AGENTTRAIL_MINIO_ENDPOINT:http://localhost:9000/}
agenttrail.ppt.image.minio-access-key=${AGENTTRAIL_MINIO_ACCESS_KEY:minioadmin}
agenttrail.ppt.image.minio-secret-key=${AGENTTRAIL_MINIO_SECRET_KEY:minioadmin}
agenttrail.ppt.image.minio-bucket=${AGENTTRAIL_PPT_IMAGE_MINIO_BUCKET:agenttrail-ppt-images}

# DeepResearch（issue #25/#34/#35/#36）：同层并发上限（Semaphore）、单次计划任务数硬上限（截断，
# 不是拒绝也不是打回去重新规划）、单任务失败重试次数（真的重试，不是像参考实现那样声明了
# 参数却从不生效）、批判循环最多跑几轮（通过或到达这个上限就停，不无限迭代）
agenttrail.deepresearch.model=${AGENTTRAIL_DEEPRESEARCH_MODEL:deepseek-chat}
agenttrail.deepresearch.max-concurrent-tasks-per-layer=${AGENTTRAIL_DEEPRESEARCH_MAX_CONCURRENT:3}
agenttrail.deepresearch.max-tasks-per-plan=${AGENTTRAIL_DEEPRESEARCH_MAX_TASKS:20}
agenttrail.deepresearch.max-task-retries=${AGENTTRAIL_DEEPRESEARCH_MAX_RETRIES:2}
agenttrail.deepresearch.max-critique-rounds=${AGENTTRAIL_DEEPRESEARCH_MAX_CRITIQUE_ROUNDS:3}
