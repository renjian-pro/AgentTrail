# Activated in the container image (see Dockerfile ENTRYPOINT). The PPT render script/templates
# live under src/main/resources/** in the source tree, which only exists on disk in local dev —
# inside the jar they're classpath resources, not files ProcessBuilder can exec. The image copies
# them to /app/ppt-scripts and /app/ppt-templates separately (see Dockerfile) and this profile
# points the existing agenttrail.ppt.* properties at those paths instead of the source-tree ones.
agenttrail:
  ppt:
    python-executable: python3
    render-script-path: /app/ppt-scripts/render_ppt_rich.py
    template-path: /app/ppt-templates/rich-template.pptx
    template-allowlist-dir: /app/ppt-templates
    output-dir: /app/ppt-output
