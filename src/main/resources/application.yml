# AgentTrail 安全默认值。真实地址、账号和密钥放在仓库根目录 application-local.yml。
spring:
  application:
    name: AgentTrail
  config:
    import: optional:file:./application-local.yml
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: ${agenttrail.model.id}
      embedding:
        options:
          model: text-embedding-v4
  datasource:
    hikari:
      maximum-pool-size: 80
      connection-timeout: 5000
      pool-name: primary-pool
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  flyway:
    # 生产部署首次接入真实库时打开(env 覆盖为 true)。db/migration/V1__init.sql 是
    # db/schema.sql 引入 Flyway那一刻的快照；baseline-on-migrate 让"已经跑过多次
    # spring.sql.init、表已存在"的库把 V1 当作已应用直接跳过，不会因为表已存在报错。
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  # Boot 默认 max-file-size/max-request-size 只有 1MB/10MB，文件问答（issue #21/#26）需要接收真实文档
  # （PDF/Word 等），默认值太小；同时要避免一次放开限制到覆盖真实场景，而不是绕开自身体验。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Tomcat 连接器自己也有一道独立的 POST 体积上限（默认 2MB），只调大 spring.servlet.multipart
# 两项不够，两道限额必须一起放大，否则 2MB~50MB 之间的文件还是会撞到这道墙。
server:
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # liveness 只看 JVM 本身活不活——K8s/docker 的存活探针不该因为下游服务临时抖动就重启进程。
        liveness:
          include: ping
        # readiness 看是否具备接流量的条件：Redis/PgVector/MinIO/DashScope 任一不可达就应该摘掉流量。
        readiness:
          include: redis,pgvector,minio,dashscope
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:3001/api/public/otel/v1/traces}
      headers:
        Authorization: ${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:}

# Token 通过 Authorization: Bearer <token> 传递，Sa-Token 的 Redis DAO 负责跨实例共享会话。
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  # 默认不配置就是 Sa-Token 自带的 2592000 秒（30 天）——token 存在浏览器 localStorage 里，
  # 意味着登录一次一个月内重新打开都不会看到登录页。改成 3 天（259200 秒）更合理。
  timeout: 259200

tavily:
  mcp-url: https://mcp.tavily.com/mcp/
  timeout-seconds: 30
  max-attempts: 2

agenttrail:
  # 所有文本生成链路的唯一模型配置；普通对话、分析、深研和 PPT 统一读取这一项。
  model:
    id: qwen-plus
  cors:
    # 生产部署必须覆盖成真实前端域名（逗号分隔多个源），默认值只覆盖本机开发。
    allowed-origins: http://localhost:5173
  filesystem:
    # 为空时使用系统临时目录下的 agenttrail-workspace；生产可覆盖成专用持久目录。
    workspace: ""
  pgvector:
    maximum-pool-size: 4
  multimodal:
    model: qwen3-vl-plus
  file:
    rag-threshold-chars: 5000
    async-threshold-bytes: 1048576
  mcp-echarts:
    url: http://localhost:3033/mcp
    timeout-seconds: 15
    max-attempts: 2
  minio:
    bucket: agenttrail-charts
  ppt:
    executor:
      pool-size: 4
      queue-capacity: 20
    recovery:
      batch-size: 20
      jitter-ms: 500
    render:
      executor:
        pool-size: 2
        queue-capacity: 8
    python-executable: python
    render-script-path: src/main/resources/ppt-scripts/render_ppt_rich.py
    template-path: src/main/resources/ppt-templates/rich-template.pptx
    template-allowlist-dir: src/main/resources/ppt-templates
    output-dir: target/ppt-output
    artifact-root: target/ppt-artifacts
    render-timeout-seconds: 60
    image:
      endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      model: qwen-image-plus
      size: "1024*1024"
      timeout-seconds: 60
      minio-bucket: agenttrail-ppt-images
  deepresearch:
    executor:
      pool-size: 4
      queue-capacity: 20
    max-concurrent-tasks-per-layer: 3
    max-tasks-per-plan: 20
    max-task-retries: 2
    max-critique-rounds: 3
    context:
      token-threshold: 60000
  redis:
    # Cross-instance task lock/broadcast is optional and disabled by default — this dev machine
    # has no standing Redis service (Redis-dependent tests spin up their own Testcontainers
    # instance). Flip enabled=true and point address at a real Redis to get RedisTaskLock/
    # RedisInterruptBroadcaster wired into AgentTaskManager (see RedisConfig).
    enabled: false
    address: redis://127.0.0.1:6379
  budget:
    per-session-tokens: 200000
  tool-rate-limit:
    # 没配 Redis 时 ToolRateLimiter 永远放行，这两个值只在 agenttrail.redis.enabled=true 时才生效。
    max-calls: 30
    window-seconds: 60
  http-rate-limit:
    # 按 userId 的 HTTP 请求级限速，同样只在配了 Redis 时生效。默认值是保守起点，生产部署前
    # 按实际用户规模/并发预期调整。
    max-calls: 60
    window-seconds: 60
  analytics:
    # Analytics data source is optional and disabled by default.
    datasource:
      enabled: false
      jdbc-url: ""
      username: ""
      password: ""
      # Recalculate this pool against MySQL max_connections per deployment.
      maximum-pool-size: 10
      connection-timeout-ms: 5000
    schema:
      provider: mschema
      exclude-tables: []
      sample-limit: 5
      sample-timeout-ms: 5000
      cache-ttl-hours: 24
      refresh-cron: "0 0 3 * * *"
    sql:
      max-joins: 3
      max-rows: 200
    execution:
      explain-timeout-seconds: 3
      max-estimated-rows: 100000
      query-timeout-seconds: 10
      max-rows: 200
      preview-rows: 20
      transient-retries: 2
    mask-fields:
      - user_profile.id_card
      - user_profile.home_address
